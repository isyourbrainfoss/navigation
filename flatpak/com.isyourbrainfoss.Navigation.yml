app-id: com.isyourbrainfoss.Navigation
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: navigation
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.GeoClue2
  - --system-talk-name=org.freedesktop.GeoClue2
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
modules:
  - name: navigation
    buildsystem: simple
    build-commands:
      # Flutter resolves libapp.so / flutter_assets relative to the binary
      # ($executable_dir/lib and $executable_dir/data).
      - install -Dm755 bundle/navigation /app/bin/navigation
      - cp -ra bundle/lib /app/bin/
      - cp -ra bundle/data /app/bin/
      - install -Dm644 com.isyourbrainfoss.Navigation.png /app/share/icons/hicolor/128x128/apps/com.isyourbrainfoss.Navigation.png
      - install -Dm644 com.isyourbrainfoss.Navigation.png /app/share/icons/hicolor/64x64/apps/com.isyourbrainfoss.Navigation.png
      - install -Dm644 com.isyourbrainfoss.Navigation.png /app/share/icons/hicolor/512x512/apps/com.isyourbrainfoss.Navigation.png
      - install -Dm644 com.isyourbrainfoss.Navigation.desktop /app/share/applications/com.isyourbrainfoss.Navigation.desktop
      # geolocator_linux sets GeoClue DesktopId from PackageInfo.appName
      # ("navigation"), not the reverse-DNS app id.
      - install -Dm644 com.isyourbrainfoss.Navigation.desktop /app/share/applications/navigation.desktop
      - install -Dm644 com.isyourbrainfoss.Navigation.metainfo.xml /app/share/metainfo/com.isyourbrainfoss.Navigation.metainfo.xml
    sources:
      - type: archive
        path: navigation-linux-bundle.tar.gz
        dest: bundle
      - type: file
        path: com.isyourbrainfoss.Navigation.png
      - type: file
        path: com.isyourbrainfoss.Navigation.desktop
      - type: file
        path: com.isyourbrainfoss.Navigation.metainfo.xml
