name: navigation
description: Phone-first OSM navigation — maps, turn-by-turn, GPX, offline tiles.
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1
  package_info_plus: ^9.0.0
  flutter_tts: ^4.2.3
  wakelock_plus: ^1.3.2
  xml: ^6.5.0
  intl: ^0.20.2
  file_picker: ^8.3.7
  dbus: ^0.7.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
